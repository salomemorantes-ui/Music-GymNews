<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Máquinas de gimnasio</title>
    <style>
        body {
            font-family: Arial;
            background-color: #111;
            color: white;
            padding: 20px;
        }
        article {
            background-color: #0615a4;
            padding: 25px;
            border-radius: 18px;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.6);
        }

        h1, h2 {
            color: #ffd6de;
        }

        a {
            color: #ffb3c1;
        }

        .imagen-container {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        .imagen-container img {
            width: 350px;
            border-radius: 18px;
            border: 3px solid #ffb3c1;
            box-shadow: 0px 10px 20px rgba(0,0,0,0.7);
            transition: transform 0.4s ease;
        }
        .imagen-container img:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
<article>
<h1>🏋️ Ejercicios básicos con máquinas</h1>

<ul>
    <li>Prensa de piernas</li>
    <li>Jalón al pecho</li>
    <li>Press de pecho</li>
    <li>Extensión de piernas</li>
    <li>Curl de bíceps en máquina</li>
</ul>

<p>
Las máquinas ayudan a mantener una técnica más segura para principiantes.
</p>
<div class="imagen-container">
    <img src="maquina.jpg" alt="maquinas">
</div>
<a href="./index.html">⬅ Volver</a>
</article>
</body>
</html>
</html>
