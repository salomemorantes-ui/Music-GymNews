<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Estiramientos</title>
    <style>
        body {
            font-family: Arial;
            background-color: #111;
            color: white;
            padding: 20px;
        }

        article {
            background-color: #0615a4;
            padding: 25px;
            border-radius: 18px;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.6);
        }

        h1, h2 {
            color: #ffd6de;
        }

        a {
            color: #ffb3c1;
        }

        .imagen-container {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }
        a {
            color:  #ffb3c1; 
        }
        .imagen-container img {
            width: 350px;
            border-radius: 18px;
            border: 3px solid #ffb3c1;
            box-shadow: 0px 10px 20px rgba(0,0,0,0.7);
            transition: transform 0.4s ease;
        }
        .imagen-container img:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
<article>
<h1>🤸 Estiramientos básicos</h1>

<ul>
    <li>Estiramiento de piernas</li>
    <li>Rotación de brazos</li>
    <li>Estiramiento de espalda</li>
    <li>Movilidad de cuello</li>
    <li>Estiramiento de hombros</li>
</ul>

<p>
Los estiramientos ayudan a prevenir lesiones y mejorar la movilidad.
</p>
<div class="imagen-container">
    <img src="ejercicio.jpg" alt="estiramientos">
</div>
<a href="./index.html">⬅ Volver</a>
</article>

</html>
